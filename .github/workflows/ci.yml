name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

# Every job blocks merging; none may use `continue-on-error`.
jobs:
  fmt:
    name: cargo fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.91
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: cargo clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.91
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings

  test:
    name: cargo test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.91
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked --all-targets --all-features

  # Prepares a transfer against the live preprod resolver
  # (crates/fluent-core/tests/live_preprod.rs). Without the API key secret, as
  # on pull requests from forks, the URL stays empty and the test skips green.
  live-preprod:
    name: live preprod
    runs-on: ubuntu-latest
    env:
      FLUENT_TRP_URL_PREPROD: ${{ secrets.FLUENT_TRP_API_KEY_PREPROD != '' && 'https://cardano-preprod.trp-m1.demeter.run' || '' }}
      FLUENT_TRP_API_KEY_PREPROD: ${{ secrets.FLUENT_TRP_API_KEY_PREPROD }}
      TEST_PARTY_A_ADDRESS: ${{ secrets.TEST_PARTY_A_ADDRESS }}
      TEST_PARTY_B_ADDRESS: ${{ secrets.TEST_PARTY_B_ADDRESS }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.91
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked -p fluent-core --test live_preprod -- --nocapture
