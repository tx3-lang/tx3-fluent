[workspace]
resolver = "3"
members = ["crates/fluent-core", "crates/fluent-server", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
license = "Apache-2.0"
repository = "https://github.com/tx3-lang/tx3-fluent"
homepage = "https://github.com/tx3-lang/tx3-fluent"
publish = false

# `cargo release <level>` bumps both crates together, makes one commit and
# tags it `v{{version}}` (on fluent-server only, so the tag is made once).
# `xtask` is development tooling and is never released.
# Nothing is pushed or published: pushing the tag triggers the image build.
[workspace.metadata.release]
shared-version = true
consolidate-commits = true
pre-release-commit-message = "release: v{{version}}"
tag = false
push = false
publish = false

# Every dependency the workspace uses is pinned here; member crates inherit with
# `workspace = true` so versions are declared in one place.
[workspace.dependencies]
fluent-core = { path = "crates/fluent-core" }
xtask = { path = "xtask" }

tx3-sdk = "=0.15.0"
rmcp = { version = "=3.4.1", features = [
    "server",
    "macros",
    "transport-io",
    "transport-streamable-http-server",
    "transport-streamable-http-server-session",
] }
axum = "0.8"
http = "1"
# Cancels the streamable HTTP service's sessions on shutdown.
tokio-util = "0.7"
# Fetches the OIDC issuer's JWKS.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
# Validates OIDC access tokens: RS256 and ES256 through the RustCrypto backend.
jsonwebtoken = { version = "11", default-features = false, features = ["rust_crypto", "use_pem"] }
# Constant-time comparison of static bearer tokens.
subtle = "2"
# The site: server-rendered pages, signed session cookies and sign-in with the
# OIDC issuer (authorization code + PKCE). oauth2 reuses the reqwest client.
askama = "0.16"
axum-extra = { version = "0.12", features = ["cookie-signed", "cookie-key-expansion"] }
oauth2 = { version = "5", default-features = false, features = ["reqwest"] }
# Cookie lifetimes, in the cookie crate's duration type.
time = { version = "0.3", default-features = false }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "time", "fs", "sync"] }
# The hosted store: users and their registration selections. `macros` only for
# `migrate!`, which embeds the migrations; queries are checked at run time.
sqlx = { version = "0.9", default-features = false, features = [
    "runtime-tokio",
    "sqlite",
    "migrate",
    "macros",
] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Same major version rmcp uses, so envelope schemas can be advertised directly as
# MCP output schemas.
schemars = "1"
thiserror = "2"
anyhow = "1"
toml = "0.8"
# Pure-Rust, panic-free YAML for skill frontmatter.
serde-saphyr = { version = "1.3", default-features = false, features = ["deserialize"] }
sha2 = "0.11"
hex = "0.4"
# Service measurements: the facade, a Prometheus text renderer without its own
# HTTP listener or push gateway, and process CPU and memory.
metrics = "0.24"
metrics-exporter-prometheus = { version = "0.18", default-features = false }
metrics-process = "2"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
pallas-addresses = "1.4"
pallas-codec = "1.4"
pallas-crypto = "1.4"
pallas-primitives = "1.4"
# Verifies Byron address checksums, which pallas-addresses does not.
crc = "3"
# Anonymous pulls of registry artifacts over rustls; no test-registry helpers.
oci-client = { version = "0.18", default-features = false, features = ["rustls-tls"] }
futures-util = "0.3"
# Validates caller arguments against generated tool schemas. No default
# features, so no HTTP or file resolution of remote references.
jsonschema = { version = "0.58", default-features = false }
# Tests only: a scripted TRP endpoint, a fake OCI registry and a JWKS.
wiremock = "0.6"
# Tests only: RSA key pairs for minting tokens.
rsa = "0.9"
rand = "0.8"
tempfile = "3"

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"

# RSA key generation in tests is unbearably slow unoptimized.
[profile.dev.package.num-bigint-dig]
opt-level = 3
