[workspace]
resolver = "3"
members = ["crates/fluent-core", "crates/fluent-server"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
license = "Apache-2.0"
repository = "https://github.com/tx3-lang/tx3-fluent"
homepage = "https://github.com/tx3-lang/tx3-fluent"
publish = false

# Every dependency the workspace uses is pinned here; member crates inherit with
# `workspace = true` so versions are declared in one place.
[workspace.dependencies]
fluent-core = { path = "crates/fluent-core" }

tx3-sdk = "=0.15.0"
rmcp = { version = "=3.4.1", features = [
    "server",
    "macros",
    "transport-io",
    "transport-streamable-http-server",
    "transport-streamable-http-server-session",
] }
axum = "0.8"
http = "1"
# Cancels the streamable HTTP service's sessions on shutdown.
tokio-util = "0.7"
# Fetches the OIDC issuer's JWKS.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
# Validates OIDC access tokens: RS256 and ES256 through the RustCrypto backend.
jsonwebtoken = { version = "11", default-features = false, features = ["rust_crypto", "use_pem"] }
# Constant-time comparison of static bearer tokens.
subtle = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "time", "fs"] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Same major version rmcp uses, so envelope schemas can be advertised directly as
# MCP output schemas.
schemars = "1"
thiserror = "2"
anyhow = "1"
toml = "0.8"
# Pure-Rust, panic-free YAML for skill frontmatter.
serde-saphyr = { version = "1.3", default-features = false, features = ["deserialize"] }
sha2 = "0.11"
hex = "0.4"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
pallas-addresses = "1.4"
pallas-codec = "1.4"
pallas-crypto = "1.4"
pallas-primitives = "1.4"
# Verifies Byron address checksums, which pallas-addresses does not.
crc = "3"
# Validates caller arguments against generated tool schemas. No default
# features, so no HTTP or file resolution of remote references.
jsonschema = { version = "0.58", default-features = false }
# Tests only: a scripted TRP endpoint and JWKS.
wiremock = "0.6"
# Tests only: RSA key pairs for minting tokens.
rsa = "0.9"
rand = "0.8"

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"

# RSA key generation in tests is unbearably slow unoptimized.
[profile.dev.package.num-bigint-dig]
opt-level = 3
