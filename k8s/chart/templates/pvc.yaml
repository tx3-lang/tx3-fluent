{{- if .Values.persistence.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "tx3-fluent.fullname" . }}-data
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "tx3-fluent.labels" . | nindent 4 }}
  annotations:
    # The store holds every user's selections; a helm uninstall must not take
    # it.
    helm.sh/resource-policy: keep
spec:
  accessModes: [ReadWriteOnce]
  {{- with .Values.persistence.storageClass }}
  storageClassName: {{ . }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.persistence.size }}
{{- end }}
